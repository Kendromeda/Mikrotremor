# USGS ARRA 2013 - three-site California subset.
#
# Every claim below is transcribed from the release itself:
#   - Component order, units and sampling rate: "FILE FORMATS.docx" shipped in
#     each site archive ("3 column ASCII file containing vertical, north and
#     east components, respectively. Measurements are in counts and sample rate
#     is 200 Hz.").
#   - Vs30 values and method: USGS Open-File Report 2013-1102, Table 3.
# Nothing here is inferred from file names or from an HVSR curve.

source_id: usgs_arra_2013
title: USGS Open-File Report 2013-1102 - ARRA site characterization
source_url: https://pubs.usgs.gov/of/2013/1102/
doi: null
license: public domain (U.S. Geological Survey)
country: USA
root: datasets_global/source_05_usgs_arra_2013/raw/extracted

recording:
  format: usgs_ascii_3c
  component_order: [vertical, north, east]
  sampling_rate_hz: 200
  units: counts
  include:
    - "*_HVSR/*.txt"
  # The HVSR file names look like YYYYMMDDhhmmss stamps, but FILE FORMATS.docx
  # does not document that convention, so start_time stays unset until a
  # source document confirms it. Set start_time_from_filename here to enable it.
  start_time_from_filename: null

  # CCC_HVSR/20110616181108.Q289.txt ends mid-sample: its last line (435214)
  # holds only the vertical value, so acquisition was cut between columns.
  # Discarding that one partial sample drops 1 of 435214 samples (0.0002% of
  # that record) and leaves the other 17 recordings untouched. Set this to
  # false to have the build refuse the file instead.
  drop_incomplete_final_row: true

asset_rules:
  - pattern: "*_HVSR/*.txt"
    media_type: ambient_noise_waveform
    note: Three-column ASCII ambient noise, per FILE FORMATS.docx
  # CI.CLC names its folder CLC_MASWSR (MASW plus seismic refraction), so the
  # pattern matches the family rather than one spelling.
  - pattern: "*_MASW*/*.dat"
    media_type: surface_wave_survey
    note: SEG-2 MASW/refraction; a c or m suffix marks edited headers
  - pattern: "*_SASW/*.DAT"
    media_type: surface_wave_survey
    note: HP SDF SASW, not SEG-2, despite sharing the .dat extension
  - pattern: "*_Forms.pdf"
    media_type: field_note
    note: Field forms carrying array geometry and recording parameters
  - pattern: "*Locations.xls*"
    media_type: site_metadata
  - pattern: "FILE FORMATS.docx"
    media_type: site_metadata
  - pattern: "*/FILE FORMATS.docx"
    media_type: site_metadata

vs30_range_mps: [50, 3000]

expectations:
  site_count: 3
  asset_count: 189
  recording_count: 18
  recordings_per_site: 6

sites:
  # Coordinates are intentionally absent: the CI-*.xls location spreadsheets in
  # each archive have not been transcribed and verified yet.
  - site_code: CI.DRE
    label:
      vs30_mps: 196
      label_method: surface_wave_multi_technique
      label_independence: independent_of_hvsr
      reference: USGS Open-File Report 2013-1102
      reference_locator: Table 3

  - site_code: CI.CCC
    label:
      vs30_mps: 432
      label_method: surface_wave_multi_technique
      label_independence: independent_of_hvsr
      reference: USGS Open-File Report 2013-1102
      reference_locator: Table 3

  - site_code: CI.CLC
    label:
      vs30_mps: 1464
      label_method: surface_wave_multi_technique
      label_independence: independent_of_hvsr
      reference: USGS Open-File Report 2013-1102
      reference_locator: Table 3
