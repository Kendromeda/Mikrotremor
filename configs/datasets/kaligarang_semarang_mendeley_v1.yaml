# Kaligarang Fault microtremor release.
# Coordinates are transcribed from the bundled Coordinat.xlsx Sheet1.  The
# `.model` profiles are documented release outputs from HVSR inversion, so they
# are tracked as derived profiles and never asserted as independent Vs30 labels.

source_id: kaligarang_semarang_mendeley_v1
title: Kaligarang Fault Semarang microtremor data
source_url: https://data.mendeley.com/datasets/3y496txbc6/1
doi: 10.17632/3y496txbc6.1
license: CC BY 4.0
country: Indonesia
root: datasets/source_06_kaligarang_semarang/raw/extracted

recording:
  format: ascii_3c
  component_order: [vertical, north, east]
  # No sampling rate is documented in the bundled coordinate workbook or raw
  # text files; it remains unset rather than inferred from a filename.
  sampling_rate_hz: null
  units: null
  include:
    - "Microtremor Data/Raw Data Microtremor/*.txt"

asset_rules:
  - pattern: "Microtremor Data/Raw Data Microtremor/*.txt"
    media_type: ambient_noise_waveform
    format_hint: ascii_3c
  - pattern: "Microtremor Data/HV curve/*.hv"
    media_type: processed_hvsr_curve
    note: Geopsy H/V result; not a raw waveform.
  - pattern: "Microtremor Data/HV curve/*.log"
    media_type: site_metadata
  - pattern: "Microtremor Data/Inversion Model/*.model"
    media_type: vs_profile
    note: HVSR inversion output; derived, not an independent label.
  - pattern: "Microtremor Data/Coordinat.xlsx"
    media_type: site_metadata

expectations:
  site_count: 41
  asset_count: 185
  recording_count: 41
  recordings_per_site: 1
  require_labels: false

