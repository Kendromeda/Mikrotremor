[project]
name = "mhvsr-vs30"
version = "0.2.0"
description = "Recording-level manifests and canonical raw readers for mHVSR-based Vs30 estimation"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.txt" }

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "obspy>=1.4",
    "hvsrpy>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

[project.scripts]
mhvsr-vs30 = "mhvsr_vs30.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mhvsr_vs30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "requires_real_data: test needs the real dataset tree under datasets_global/",
]

[tool.coverage.run]
source = ["mhvsr_vs30"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["mhvsr_vs30", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["src/mhvsr_vs30"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["obspy.*", "hvsrpy.*", "pyarrow.*"]
ignore_missing_imports = true
